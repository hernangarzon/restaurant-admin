<div class="change-password-card">
  <h2>Cambiar contraseña</h2>

  @if (obligatorio()) {
    <div class="aviso" role="status">
      Estás usando una contraseña temporal. Crea una nueva para continuar.
    </div>
  }
  @if (errorMsg()) {
    <div class="error" role="alert">{{ errorMsg() }}</div>
  }
  @if (successMsg()) {
    <div class="success" role="status">{{ successMsg() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="passwordActual">{{ obligatorio() ? 'Contraseña temporal' : 'Contraseña actual' }}</label>
      <input id="passwordActual" type="password" formControlName="passwordActual" autocomplete="current-password" />
    </div>

    <div class="form-group">
      <label for="nuevaPassword">Nueva contraseña</label>
      <input id="nuevaPassword" type="password" formControlName="nuevaPassword" autocomplete="new-password"
        aria-describedby="ayuda-password" />
      <small id="ayuda-password">Mínimo {{ minLongitud }} caracteres.</small>
    </div>

    <div class="form-group">
      <label for="confirmarPassword">Confirmar nueva contraseña</label>
      <input id="confirmarPassword" type="password" formControlName="confirmarPassword" autocomplete="new-password" />
    </div>

    <button type="submit" [disabled]="loading() || form.invalid">
      {{ loading() ? 'Guardando...' : 'Actualizar contraseña' }}
    </button>
  </form>
</div>
